<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Vedant 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #f7b8cc;
    --deep-pink: #d85c8a;
    --cream: #fff9f8;
    --text: #754357;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 15% 20%, #ffe4ee 0%, transparent 40%),
        radial-gradient(ellipse at 85% 80%, #f9c9df 0%, transparent 42%),
        linear-gradient(135deg, #fff8f8, #fce5ed, #f8d5e6);
}

/* Soft glowing background */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    pointer-events: none;
}

body::before {
    background: #f4a5c4;
    top: -130px;
    left: -100px;
}

body::after {
    background: #e8b9f4;
    bottom: -150px;
    right: -100px;
}

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    color: white;
    text-shadow: 0 0 12px #e58bb1;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.3); }
}

.heart {
    position: fixed;
    bottom: -50px;
    color: #e99ab9;
    opacity: 0;
    pointer-events: none;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: .5; }
    85% { opacity: .4; }
    100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

.main-card {
    position: relative;
    width: min(92%, 540px);
    padding: 36px 28px 34px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 32px;
    background: rgba(255, 250, 251, .55);
    box-shadow:
        0 25px 80px rgba(181, 91, 129, .15),
        inset 0 0 35px rgba(255,255,255,.65);
    backdrop-filter: blur(18px);
    animation: appear 1.2s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.top-label {
    font-size: 10px;
    letter-spacing: 5px;
    color: #bd7694;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.small-heart {
    color: #dc7ca1;
    font-size: 19px;
    margin-bottom: 4px;
    animation: heartbeat 1.8s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.2); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(53px, 11vw, 76px);
    font-weight: 400;
    line-height: 1.2;
    color: #c65f89;
    text-shadow: 0 4px 25px rgba(217, 117, 157, .18);
}

.subtitle {
    margin-top: 7px;
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: #96647a;
}

.photo-frame {
    width: 148px;
    height: 148px;
    margin: 27px auto 23px;
    padding: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff, #e9a4c0, #fff1f6, #d98db0);
    box-shadow: 0 0 0 5px rgba(255,255,255,.35),
                0 10px 35px rgba(189, 90, 133, .2);
    animation: photoGlow 4s ease-in-out infinite;
}

@keyframes photoGlow {
    0%, 100% { box-shadow: 0 0 0 5px rgba(255,255,255,.35), 0 10px 35px rgba(189,90,133,.18); }
    50% { box-shadow: 0 0 0 8px rgba(255,255,255,.45), 0 10px 45px rgba(189,90,133,.3); }
}

.photo-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.9);
}

.countdown-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 400;
    color: #9d5b79;
    margin-bottom: 18px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.time-box {
    padding: 17px 4px 14px;
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 17px;
    background: linear-gradient(150deg, rgba(255,255,255,.8), rgba(255,233,241,.68));
    box-shadow: 0 8px 20px rgba(195, 104, 143, .08);
    transition: transform .3s ease;
}

.time-box:hover {
    transform: translateY(-5px);
}

.number {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(25px, 6vw, 35px);
    line-height: 1.3;
    color: #c25c85;
    font-variant-numeric: tabular-nums;
}

.unit {
    display: block;
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a67b8d;
}

.date-line {
    margin-top: 25px;
    color: #bd7694;
    font-size: 10px;
    letter-spacing: 4px;
}

.bottom-heart {
    margin-top: 15px;
    font-size: 13px;
    color: #d77ea0;
    letter-spacing: 5px;
}

@media (max-width: 400px) {
    .main-card {
        padding: 28px 17px;
    }

    .photo-frame {
        width: 125px;
        height: 125px;
        margin: 22px auto;
    }

    .countdown {
        gap: 6px;
    }

    .time-box {
        padding: 14px 2px 12px;
        border-radius: 13px;
    }

    .unit {
        font-size: 8px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main class="main-card">
    <p class="top-label">A little countdown for someone special</p>

    <div class="small-heart">♡</div>

    <h1>Hey, Vedant</h1>
    <p class="subtitle">your special day is almost here</p>

    <div class="photo-frame">
        <img src="images/vedant.jpeg" alt="Vedant">
    </div>

    <p class="countdown-title">Counting down to your day ✨</p>

    <div class="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="unit">Days</span>
        </div>

        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="unit">Hours</span>
        </div>

        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="unit">Minutes</span>
        </div>

        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="unit">Seconds</span>
        </div>
    </div>

    <p class="date-line">04 · NOVEMBER · 2026</p>

    <div class="bottom-heart">♡ &nbsp; ✧ &nbsp; ♡</div>
</main>

<script>
/* Countdown to November 4, 2026 */
const birthday = new Date("November 4, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = Date.now();
    const difference = birthday - now;

    if (difference <= 0) {
        document.querySelector(".countdown-title").textContent =
            "Happy Birthday, Vedant! ♡";

        ["days", "hours", "minutes", "seconds"].forEach(id => {
            document.getElementById(id).textContent = "00";
        });

        return;
    }

    document.getElementById("days").textContent =
        String(Math.floor(difference / (1000 * 60 * 60 * 24))).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(Math.floor((difference / (1000 * 60 * 60)) % 24)).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(Math.floor((difference / (1000 * 60)) % 60)).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(Math.floor((difference / 1000) % 60)).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* Twinkling stars */
const stars = document.getElementById("stars");

for (let i = 0; i < 38; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.textContent = Math.random() > 0.5 ? "✧" : "·";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = (10 + Math.random() * 16) + "px";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = (2 + Math.random() * 3) + "s";
    stars.appendChild(star);
}

/* Floating hearts */
for (let i = 0; i < 15; i++) {
    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "♡" : "♥";
    heart.style.left = Math.random() * 100 + "%";
    heart.style.fontSize = (12 + Math.random() * 18) + "px";
    heart.style.animationDuration = (9 + Math.random() * 10) + "s";
    heart.style.animationDelay = Math.random() * 12 + "s";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
